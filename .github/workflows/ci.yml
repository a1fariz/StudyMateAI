name: StudyMate AI CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.12"

jobs:
  # ──────────────────────────────────────
  # Lint & Type Check
  # ──────────────────────────────────────
  lint:
    name: 🔍 Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install linters
        run: pip install ruff

      - name: Run Ruff linter
        run: ruff check backend/ --output-format=github

      - name: Run Ruff formatter check
        run: ruff format --check backend/

  # ──────────────────────────────────────
  # Unit & Integration Tests
  # ──────────────────────────────────────
  test:
    name: 🧪 Test Suite
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx

      - name: Run tests
        env:
          DATABASE_URL: sqlite+aiosqlite:///./test_studymate.db
          SECRET_KEY: ci-test-secret-key
          GEMINI_API_KEY: ci-test-key
          UPLOAD_DIR: ./test_uploads
          CHROMA_PERSIST_DIR: ./test_chroma_data
          DEBUG: "false"
        run: |
          python -m pytest tests/ -v --tb=short -x

      - name: Cleanup test artifacts
        if: always()
        run: |
          rm -f test_studymate.db
          rm -rf test_uploads test_chroma_data

  # ──────────────────────────────────────
  # Docker Build Validation
  # ──────────────────────────────────────
  docker:
    name: 🐳 Docker Build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -f backend/Dockerfile -t studymate-backend .

      - name: Build frontend image
        run: docker build -f frontend/Dockerfile -t studymate-frontend .

      - name: Verify backend image
        run: docker run --rm studymate-backend python -c "from backend.config import Settings; print('✅ Config OK')"

  # ──────────────────────────────────────
  # Security Audit
  # ──────────────────────────────────────
  security:
    name: 🔒 Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Audit dependencies
        run: pip-audit -r requirements.txt --ignore-vuln PYSEC-2024-* || true
